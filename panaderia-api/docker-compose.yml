version: '3.8'
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: panaderia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/panaderia

volumes:
  postgres_data:
    precio_unitario: float = Field(..., gt=0)
    stock: int = Field(..., ge=0)
    disponible: Optional[bool] = True

    @validator("categoria")
    def categoria_valida(cls, v):
        if v not in CATEGORIAS_VALIDAS:
            raise ValueError("Categoría inválida")
        return v

class ProductoCreate(ProductoBase):
    pass

class ProductoUpdate(BaseModel):
    nombre: Optional[str] = Field(None, max_length=150)
    categoria: Optional[str]
    precio_unitario: Optional[float] = Field(None, gt=0)
    stock: Optional[int] = Field(None, ge=0)
    disponible: Optional[bool]

    @validator("categoria")
    def categoria_valida(cls, v):
        if v and v not in CATEGORIAS_VALIDAS:
            raise ValueError("Categoría inválida")
        return v

class ProductoOut(ProductoBase):
    id: int
    fecha_registro: datetime
    fecha_actualizacion: Optional[datetime]

    class Config:
        orm_mode = True

version: '3.8'
services:
  db:
    image: postgres:13
    environment:
